    <title>Form Detection — Missouri EPIC</title>

  <body>
    <!--
      This file exists only so Netlify's build-time form-detection bot can
      find these forms. The site is a client-rendered SPA (Vite/React), so
      forms rendered by React are never present in the static HTML Netlify
      scans at deploy time. Do not link to this page or remove it.
    -->
    <form name="contact-general" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
